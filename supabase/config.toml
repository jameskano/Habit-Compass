project_id = "habit-compass"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback?flow=signup",
  "http://127.0.0.1:5173/auth/callback?flow=recovery",
  "http://127.0.0.1:5173/auth/callback?flow=email-change",
  "http://127.0.0.1:5173/account/delete",
  "https://habit-compass.onrender.com/account/delete",
  "habitcompass://auth/callback",
  "habitcompass://auth/callback?flow=signup",
  "habitcompass://auth/callback?flow=recovery",
  "habitcompass://auth/callback?flow=email-change",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
host = "inbucket"
port = 2500
user = "local"
pass = "local"
admin_email = "auth@habitcompass.local"
sender_name = "Habit Compass"

[auth.email.notification.email_changed]
enabled = true
subject = "Your Habit Compass email changed"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Habit Compass password changed"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
