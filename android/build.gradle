// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def androidBuildRoot = new File(
    System.getenv('HABIT_COMPASS_ANDROID_BUILD_DIR') ?:
        "${System.getenv('LOCALAPPDATA') ?: gradle.gradleUserHomeDir}/HabitCompass/android-build"
)

rootProject.layout.buildDirectory.set(new File(androidBuildRoot, 'root'))

allprojects {
    layout.buildDirectory.set(new File(androidBuildRoot, path == ':' ? 'root' : path.substring(1).replace(':', '-')))

    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete androidBuildRoot
}

project(':app') {
    tasks.register('writeDebugIdeApkRedirect') {
        outputs.upToDateWhen { false }

        doLast {
            def redirectDir = new File(
                project.projectDir,
                'build/intermediates/apk_ide_redirect_file/debug/createDebugApkListingFileRedirect'
            )
            def listingFile = layout.buildDirectory.file('outputs/apk/debug/output-metadata.json').get().asFile

            redirectDir.mkdirs()
            new File(redirectDir, 'redirect.txt').text = [
                '#- File Locator -',
                "listingFile=${redirectDir.toPath().relativize(listingFile.toPath()).toString().replace('\\', '/')}",
                ''
            ].join(System.lineSeparator())
        }
    }

    tasks.matching { it.name in ['assembleDebug', 'packageDebug', 'createDebugApkListingFileRedirect'] }.configureEach {
        finalizedBy tasks.named('writeDebugIdeApkRedirect')
    }
}
